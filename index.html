<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0; url=web/index.html" />
  <title>ORBITX — Mars Sentinel | NASA Space Apps Challenge 2026</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-obsidian: #08090c;
      --panel-bg: rgba(14, 17, 23, 0.9);
      --panel-border: rgba(255, 255, 255, 0.12);
      --text-primary: #f3f5f8;
      --text-secondary: #9ba3b2;
      --accent-ochre: #e07a47;
      --accent-cyan: #2cd4d9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 20%, rgba(224, 122, 71, 0.16), transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(44, 212, 217, 0.12), transparent 45%),
        var(--bg-obsidian);
      color: var(--text-primary);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    main {
      width: 100%;
      max-width: 540px;
      padding: 32px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      text-align: center;
    }

    .kicker {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent-cyan);
      margin-bottom: 10px;
    }

    h1 {
      font-size: 26px;
      line-height: 1.25;
      margin-bottom: 12px;
    }

    p {
      font-size: 15px;
      line-height: 1.55;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }

    .launch-btn {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent-ochre), #c85c2b);
      color: #ffffff;
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .launch-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }
  </style>
  <script>
    window.location.replace('./web/index.html' + window.location.search + window.location.hash);
  </script>
</head>
<body>
  <main>
    <div class="kicker">NASA Space Apps Challenge 2026</div>
    <h1>ORBITX — Mars Sentinel</h1>
    <p>
      Launching the Jezero Crater Digital Twin (<code>./web/index.html</code>)...
      If your browser does not redirect automatically, continue below.
    </p>
    <a class="launch-btn" href="./web/index.html" role="button">Open Mars Sentinel Web Twin</a>
  </main>
</body>
</html>
